# HTTPS docs site for blr-kiruthika.strykercorp.com
# Install: ./scripts/setup-docs-https.sh

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blr-kiruthika.strykercorp.com;

    # Intermediate CA is SHA-1 signed; OpenSSL 3 rejects it in the chain file.
    # Server cert only — browsers fetch the intermediate via AIA if needed.
    ssl_certificate     /etc/nginx/ssl/blr-kiruthika-server.crt;
    ssl_certificate_key /etc/nginx/ssl/blr-kiruthika.strykercorp.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         DEFAULT:@SECLEVEL=1;
    ssl_prefer_server_ciphers on;

    root /home/tpx-admin/.cursor-server/Windows-Patch-Automation-Framework/docs;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(md|pdf|txt)$ {
        default_type text/plain;
        charset utf-8;
    }

    access_log /var/log/nginx/windows-patch-docs.access.log;
    error_log  /var/log/nginx/windows-patch-docs.error.log;
}

# Keep HTTP on 8080 for IP access; redirect hostname traffic to HTTPS.
server {
    listen 8080;
    listen [::]:8080;
    server_name blr-kiruthika.strykercorp.com;

    return 301 https://$host$request_uri;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /home/tpx-admin/.cursor-server/Windows-Patch-Automation-Framework/docs;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(md|pdf|txt)$ {
        default_type text/plain;
        charset utf-8;
    }

    access_log /var/log/nginx/windows-patch-docs-http.access.log;
    error_log  /var/log/nginx/windows-patch-docs-http.error.log;
}
