# Optional nginx config for IT teams that prefer nginx over Python http.server.
# Install: sudo dnf install nginx
# Deploy:  sudo cp deploy/nginx-windows-patch-docs.conf /etc/nginx/conf.d/windows-patch-docs.conf
#          sudo nginx -t && sudo systemctl enable --now nginx

server {
    listen 8080;
    listen [::]:8080;
    server_name blr-kiruthika.strykercorp.com;

    root /home/tpx-admin/.cursor-server/Windows-Patch-Automation-Framework/docs;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(md|pdf|txt)$ {
        default_type text/plain;
        charset utf-8;
    }

    access_log /var/log/nginx/windows-patch-docs.access.log;
    error_log  /var/log/nginx/windows-patch-docs.error.log;
}
